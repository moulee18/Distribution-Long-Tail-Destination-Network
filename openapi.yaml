components:
  schemas:
    AssistPackFile:
      properties:
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        type:
          type: string
          title: Type
      type: object
      required:
      - name
      - url
      - type
      title: AssistPackFile
    Body_import_catalogue_csv_api_v1_catalogue_import_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
        raw_csv:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Csv
        allow_local:
          type: boolean
          title: Allow Local
          default: true
      type: object
      title: Body_import_catalogue_csv_api_v1_catalogue_import_post
    Body_upload_asset_api_v1_storage_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_asset_api_v1_storage_upload_post
    BuildAssistPackRequest:
      properties:
        rendition:
          $ref: '#/components/schemas/RenditionData'
        destination:
          $ref: '#/components/schemas/DestinationData'
      type: object
      required:
      - rendition
      - destination
      title: BuildAssistPackRequest
    BuildAssistPackResponse:
      properties:
        files:
          items:
            $ref: '#/components/schemas/AssistPackFile'
          type: array
          title: Files
        caption:
          type: string
          title: Caption
        deep_link:
          type: string
          title: Deep Link
        checklist:
          items:
            type: string
          type: array
          title: Checklist
      type: object
      required:
      - caption
      - deep_link
      title: BuildAssistPackResponse
    CertificationResponse:
      properties:
        id:
          type: string
          title: Id
        destination_id:
          type: string
          title: Destination Id
        connector_key:
          type: string
          title: Connector Key
        status:
          type: string
          title: Status
        tested_level:
          type: string
          title: Tested Level
        resulting_level:
          type: string
          title: Resulting Level
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
        cleanup_status:
          type: string
