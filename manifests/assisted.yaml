key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: manual_submission
    content_types: [text, image, video_link, link]
    spec:
      title_max_chars: 500
      body_max_chars: 50000
      links_allowed: true
      media_supported: [image/jpeg, image/png, video/mp4]
rate_limits:
  per_connection:
    requests: 1000
    per_seconds: 60
capabilities: [build_assist_pack]
error_map: {}
instance_param: none
