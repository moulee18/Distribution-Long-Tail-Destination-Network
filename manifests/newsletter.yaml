key: newsletter
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: campaign
    content_types: [text, image, link]
    spec:
      title_max_chars: 150
      body_max_chars: 50000
      links_allowed: true
      media_supported: [image/jpeg, image/png]
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "400": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
instance_param: audience_id
