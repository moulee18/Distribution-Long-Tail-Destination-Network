key: webhook
version: 1.0.0
tier: bridge
auth: api_key
surfaces:
  - key: publication
    content_types: [text, image, link]
    spec:
      title_max_chars: 255
      body_max_chars: 65535
      links_allowed: true
      media_supported: [image/jpeg, image/png, image/webp]
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: webhook_url
